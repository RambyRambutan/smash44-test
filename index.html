<script>
// The Smash 44 — core logic (ใช้ได้ทั้ง Apps Script และ Node test)
// ไม่มี dependency: วางไฟล์นี้ใน Apps Script เป็น core.gs ได้เลย

var TZ_OFFSET = '+07:00';

function dayOfWeek_(dateISO) {
  return new Date(dateISO + 'T12:00:00' + TZ_OFFSET).getUTCDay();
}
function startHour_(hour) {
  return parseInt(String(hour).split('-')[0], 10);
}

// ราคาต่อชั่วโมงของแต่ละช่อง (โปร 149 คิดจากทั้งการจอง)
// opts.peak = ราคาช่วงพีค จ–ศ 18–22 (รายครั้ง 280, รายเดือน 250)
function slotPrices(dateISO, hours, opts) {
  var peak = (opts && opts.peak) || 280;
  var dow = dayOfWeek_(dateISO);
  var weekend = dow === 0 || dow === 6;
  var day = hours.filter(function (h) { var s = startHour_(h); return s >= 8 && s < 18; }).length;
  return hours.map(function (h) {
    if (weekend) return 200;
    var s = startHour_(h);
    if (s >= 8 && s < 18) return day >= 2 ? 149 : 200;
    if (s >= 18 && s < 22) return peak;
    return 200;
  });
}

function calcPrice(dateISO, hours) {
  return slotPrices(dateISO, hours).reduce(function (a, b) { return a + b; }, 0);
}

// เวลาเริ่ม/จบจริงของช่อง เช่น "24-01" = 00:00–01:00 ของวันถัดไป
function slotTime(dateISO, hour) {
  var base = new Date(dateISO + 'T00:00:00' + TZ_OFFSET).getTime();
  var s = startHour_(hour);
  var start = new Date(base + s * 3600000);
  return { start: start, end: new Date(start.getTime() + 3600000) };
}

    return t_(x, { size: 'lg', color: FX.text, weight: 'bold' }); }) };
}
function billRows_(bill) {
  var rows = [];
  if (bill.credit) {
    rows.push(kv_('ค่าสนาม', fmt_(bill.gross) + ' บาท'));
    rows.push(kv_('หักฝากขาย', '-' + fmt_(bill.credit) + ' บาท'));
  }
  var out = { type: 'box', layout: 'vertical', spacing: 'xs', margin: 'md', contents: rows.length ? rows : [{ type: 'filler' }] };
  return rows.length ? [out, moneyBox_('ยอดชำระ', bill.total, 'due')] : [moneyBox_('ยอดชำระ', bill.total, 'due')];
}
function planText_(plan) {
  return planLines(plan).map(function (x) { return t_(x, { size: plan.lines ? 'sm' : 'lg', color: FX.text, weight: 'bold' }); });
}
function shortMonth_(ym) { var p = ym.split('-').map(Number); return TH_MONTHS[p[1] - 1] + ' ' + (p[0] + 543); }
function liffBtn_(label, page, primary) {
  return { type: 'button', style: primary ? 'primary' : 'link', color: primary ? FX.navy : FX.purple, height: 'sm',
    action: { type: 'uri', label: label, uri: LIFF_URL + '?page=' + page } };
}
function buildRenewalFlex(plan, bill, ym) {
  var body = planText_(plan).concat(billRows_(bill), [note_(payByNote_(ym), FX.amber)]);
  return compact_('ต่ออายุรายเดือน', shortMonth_(ym), body,
    [mainBtn_('ยืนยันและชำระเงิน', 'renew&m=' + ym), linkBtn_('ยกเลิกรายเดือน', 'renew-cancel&m=' + ym)],
    'ต่ออายุรายเดือน ' + thaiMonth(ym) + ' ยอด ' + fmt_(bill.total) + ' บาท', { tone: 'renew' });
}
function payByNote_(ym) { return 'ชำระภายใน ' + deadlineText_(ym) + '\nหากเลยกำหนดจะยกเลิกอัตโนมัติ'; }
function buildReminderFlex(plan, bill, ym) {
  var body = planText_(plan).concat(billRows_(bill), [note_(payByNote_(ym), FX.amber)]);
  return compact_('ต่ออายุรายเดือน', shortMonth_(ym), body,
    [mainBtn_('ยืนยันและชำระเงิน', 'renew&m=' + ym), linkBtn_('ยกเลิกรายเดือน', 'renew-cancel&m=' + ym)],
    'วันสุดท้าย! ชำระรายเดือน ' + thaiMonth(ym) + ' ภายใน 23:59', { tone: 'remind', sub: '⏰ วันสุดท้าย' });
}
// เนื้อการ์ดยืนยันรายเดือน: ตาราง + วันที่ + ยอดที่ชำระ
function passBody_(plan, slots, total, lead) {
  var dates = {};
  slots.forEach(function (s) { dates[s.date] = 1; });
  var dayList = Object.keys(dates).sort().map(function (d) { return String(Number(d.slice(8))); }).join(' · ');
  var out = lead ? [lead] : [];
  out = out.concat(planLines(plan).map(function (x) { return t_(x, { size: plan.lines ? 'sm' : 'lg', color: FX.text, weight: 'bold' }); }));
  if (dayList) out.push(t_('วันที่ ' + dayList, { size: 'sm', color: FX.purple, weight: 'bold' }));
  if (total != null) out.push(moneyBox_('ชำระแล้ว', total, 'paid'));
  return out;
}
function buildMonthlyTicketFlex(mb, plan, ym) {
  return compact_('✅ ยืนยันการจอง', mb.id, passBody_(plan, mb.slots, mb.total), [linkBtn_('ดูการจอง / ฝากขาย', 'monthly')],
    'บัตรรายเดือน ' + thaiMonth(ym) + ' ' + mb.id, { tone: 'pass', sub: 'รายเดือน ' + thaiMonth(ym) });
}
// ยกเลิกรายเดือน 2 กรณี: ไม่ชำระภายในกำหนด / ลูกค้ายืนยันยกเลิกเอง · มีเงินฝากขายค้าง → กล่องเงินคืน + ปุ่มรับเงินคืน
// sold = ช่องที่ฝากขายได้ [{ key: "2026-11-30|B4|19-20", price: 250 }] (หรือคีย์อย่างเดียว) → วันที่ แล้วสนาม·เวลา + ราคา
function soldList_(sold) {
  var by = {}, out = [];
  (sold || []).forEach(function (x) { var k = typeof x === 'string' ? x : x.key, p = k.split('|');
    (by[p[0]] = by[p[0]] || []).push({ court: p[1], hour: p[2], price: typeof x === 'string' ? null : x.price }); });
  Object.keys(by).sort().forEach(function (d) {
    out.push(t_(dateYearText_(d), { size: 'sm', color: FX.purple, weight: 'bold', margin: 'sm', align: 'start' }));
    by[d].sort(function (a, b) { return courtOrder_(a.court) - courtOrder_(b.court) || startHour_(a.hour) - startHour_(b.hour); }).forEach(function (s) {
      out.push({ type: 'box', layout: 'horizontal', alignItems: 'center', contents: [ // ชิดซ้าย-ขวา
        t_(slotRanges([s])[0], { size: 'md', color: FX.text, weight: 'bold', flex: 6, align: 'start' }),
        t_(s.price != null ? fmt_(s.price) + ' บาท' : ' ', { size: 'sm', color: FX.text, flex: 4, align: 'end' })] });
    });
  });
  return out.length ? [t_('รายการฝากขาย', { size: 'xs', color: FX.sub, weight: 'bold', margin: 'lg', align: 'start' })].concat(out) : out;
}
function cancelCard_(plan, ym, why, owed, alt, soldKeys) {
  var body = planText_(plan).concat([t_(why, { size: 'sm', color: FX.red, weight: 'bold', margin: 'md' })]);
  var btns = [linkBtn_('จองใหม่', 'book')]; // ปุ่มกรอบเทาแบบเดียวกันทั้ง 2 กรณี
  if (owed > 0) { body = body.concat(soldList_(soldKeys)); body.push(refundBox_(owed, 'ยอดฝากขาย')); btns = [refundBtn_(), linkBtn_('จองใหม่', 'book')]; }
  return compact_('ยกเลิกรายเดือน', shortMonth_(ym), body, btns, alt, { red: true });
}
function buildRenewalExpiredFlex(plan, ym, owed, soldKeys) {
  return cancelCard_(plan, ym, 'ไม่ชำระภายในกำหนด รายเดือนถูกยกเลิก', owed, 'ยกเลิกรายเดือน ' + thaiMonth(ym) + ' (เลยกำหนดชำระ)', soldKeys);
}
function buildRenewalCancelledFlex(plan, ym, owed, soldKeys) {
  return cancelCard_(plan, ym, 'ลูกค้ายืนยันยกเลิกรายเดือน', owed, 'ยกเลิกรายเดือน ' + thaiMonth(ym) + (owed > 0 ? ' · คืนเงิน ' + fmt_(owed) + ' บาท' : ''), soldKeys);
}

function buildChangeResultFlex(oldPlan, newPlan, res, ym) {
  var title, plan, rows = [], note, btns = [linkBtn_('ดูการจอง', 'monthly')], red = false, tone = 'move';
  if (res.result === 'moved') {
    title = '✅ ย้ายสนามสำเร็จ'; plan = newPlan;
    var st = res.settle || { type: 'none' };
    if (st.type === 'extra') {
      rows.push(moneyBox_('ชำระเพิ่ม', st.amount, 'extra'));
      note = { type: 'box', layout: 'vertical', margin: 'md', spacing: 'xs', contents: [
        t_('ครบกำหนด ' + dateTimeText_(st.payBy), { size: 'sm', color: FX.red, weight: 'bold' }),
        t_('กรุณาชำระภายใน 24 ชม.\nหากไม่ชำระภายในเวลาที่กำหนด\nระบบจะใช้ตารางเดิมค่ะ', { size: 'xs', color: FX.amber })] };
      btns = [mainBtn_('ชำระส่วนต่าง', 'pay-extra&m=' + ym)];
    } else if (st.type === 'refund') {
      note = refundBox_(st.amount); btns = [refundBtn_(), linkBtn_('ดูการจอง', 'monthly')];
    } else note = note_('ยอดเท่าเดิม ไม่ต้องชำระเพิ่มค่ะ');
  } else if (res.result === 'cancelled') {
    title = 'ยกเลิกรายเดือน'; plan = oldPlan; red = true;
    rows.push(t_('ไม่ได้สนามที่ขอ ยกเลิกตามที่เลือกไว้ค่ะ', { size: 'sm', color: FX.sub }));
    note = refundBox_(res.settle.amount); btns = [refundBtn_()];
  } else {
    // ไม่ได้สนามที่ขอ → ยืนยันการจองรายเดือนตามตารางเดิม
    var lead = t_('สนามที่ขอยังไม่ว่าง ยืนยันตารางเดิมให้ค่ะ', { size: 'sm', color: FX.sub, weight: 'bold' });
    return compact_('✅ ยืนยันการจอง', shortMonth_(ym), passBody_(oldPlan, monthlySlots(oldPlan, ym), res.paid != null ? res.paid : null, lead),
      [linkBtn_('ดูการจอง / ฝากขาย', 'monthly')], 'ผลการขอย้ายสนาม ' + thaiMonth(ym) + ': ใช้ตารางเดิม', { tone: 'pass', sub: 'รายเดือน ' + thaiMonth(ym) });
  }
  var body = planText_(plan);
  if (rows.length) body.push({ type: 'box', layout: 'vertical', margin: 'md', contents: rows });
  body.push(note);
  return compact_(title, shortMonth_(ym), body, btns, 'ผลการขอย้ายสนาม ' + thaiMonth(ym) + ': ' + title, { red: red, tone: tone });
}

function psThaiHour_(h) {

  if (h <= 18) return (h - 12) + ' โมง'; if (h <= 23) return (h - 18) + ' ทุ่ม'; if (h === 24) return 'เที่ยงคืน'; return 'ตี ' + (h - 24);
}
function psStartOf_(k) { return Number(k.split('-')[0]); }
function psRange_(hours) {
  var hs = hours.map(psStartOf_).sort(function (a, b) { return a - b; }), segs = [], a = hs[0], p = hs[0];
  for (var i = 1; i <= hs.length; i++) { if (i < hs.length && hs[i] === p + 1) { p = hs[i]; continue; } segs.push([a, p + 1]); a = p = hs[i]; }
  return segs;
}
function psFmt2_(n) { var h = n >= 25 ? n - 24 : n; return ('0' + h).slice(-2) + '.00'; }
function psTimeText_(hours) { return psRange_(hours).map(function (s) { return psFmt2_(s[0]) + '-' + psFmt2_(s[1] === 25 ? 25 : s[1]); }).join(', '); }
function psThaiRange_(hours) {
  var s = psRange_(hours), a = s[0][0], b = s[s.length - 1][1];
  if (a >= 19 && b <= 23) return (a - 18) + '-' + (b - 18) + ' ทุ่ม';
  return psThaiHour_(a) + '-' + psThaiHour_(b);
}
// items → แถว (วัน, เวลา, คอร์ท, ลูกค้า) · ถ้ารวมเป็นแถวเดียวไม่ได้ แยกตามวัน
function psRowsFromPlan(name, items) {
  var days = [], courts = [], byCourt = {};
  items.forEach(function (it) {
    if (days.indexOf(it.weekday) < 0) days.push(it.weekday);
    if (courts.indexOf(it.court) < 0) courts.push(it.court);
    var k = it.court, hk = it.hours.slice().sort().join(',');
    byCourt[k] = byCourt[k] || {}; byCourt[k][it.weekday] = hk;
  });
  days.sort(function (a, b) { return (a || 7) - (b || 7); });
  var uniform = courts.every(function (c) { return days.every(function (d) { return byCourt[c][d] && byCourt[c][d] === byCourt[c][days[0]]; }); });
  function mk(ds, cs, hoursOf) {
    var dTxt = ds.map(function (d) { return PS_DAY_TXT[d]; }).join(' '), allH = [];
    cs.forEach(function (c) { hoursOf(c).forEach(function (h) { if (allH.indexOf(h) < 0) allH.push(h); }); });
    var same = cs.every(function (c) { return hoursOf(c).join(',') === hoursOf(cs[0]).join(','); });
    var tTxt = same ? psTimeText_(hoursOf(cs[0])) : cs.map(function (c) { return psTimeText_(hoursOf(c)); }).join(', ');
    return { 'ลูกค้า': name + ' ' + dTxt + ' ' + psThaiRange_(allH) + ' ' + cs.join(', '), 'วัน': dTxt, 'เวลา': tTxt, 'คอร์ท': cs.join(', ') };
  }
  if (uniform) return [mk(days, courts, function (c) { return byCourt[c][days[0]].split(','); })];
  return days.map(function (d) {
    var cs = courts.filter(function (c) { return byCourt[c][d]; });
    return mk([d], cs, function (c) { return byCourt[c][d].split(','); });
  });
}

// ── แผนของเดือน (จากชีต) ──
function psRows_(deps, ym) { return deps.store.rows(psTable_(ym)).filter(function (r) { return psStr_(r['ลูกค้า']); }); }
function psPlans_(deps, ym, all) {
  var by = {}, order = [];
  psRows_(deps, ym).forEach(function (r) {
    var code = psStr_(r['รหัสลูกค้า']);
    if (!code || (!all && psStr_(r['สถานะ']) === PS_CANCEL)) return;
    if (!by[code]) { by[code] = { planId: code, userId: psStr_(r.userId), name: psShortName(r), items: [], rows: [], billStatus: psStr_(r['สถานะการส่งบิล']), status: psStr_(r['สถานะ']), sheetTotal: 0, warn: [] }; order.push(code); }
    var p = by[code], pp = psParsePlan(r);
    p.items = p.items.concat(pp.items); p.rows.push(r); p.warn = p.warn.concat(pp.warn);
    if (!p.userId && psStr_(r.userId)) p.userId = psStr_(r.userId);
    var n = psNum_(r['ยอดรวม (บาท)']); p.sheetTotal = p.sheetTotal === null || n === null ? null : p.sheetTotal + n;
  });
  return order.map(function (k) { return by[k]; });
}
function psApproved_(deps, p) {
  if (p.billStatus === PS_OK || p.billStatus === PS_SENT || p.billStatus === PS_FOLLOW) return true;
  return !!deps.config.autoApproveBills && p.billStatus !== PS_CHECK;
}
// อัปเดตทุกแถวของลูกค้าในเดือนนั้น (คอลัมน์ที่ไม่มีในบล็อกเก่า ระบบข้าม)
function psSet_(deps, ym, planId, patch) {
  var n = 0;
  psRows_(deps, ym).forEach(function (r) {
    if (psStr_(r['รหัสลูกค้า']) !== planId) return;
    var diff = {};
    Object.keys(patch).forEach(function (k) { if (psStr_(r[k]) !== psStr_(patch[k])) diff[k] = patch[k]; });
    if (Object.keys(diff).length) { deps.store.update(psTable_(ym), r._row, diff); n++; }
  });
  return n;
}
function psAddNote_(deps, ym, planId, note) {
  psRows_(deps, ym).forEach(function (r) {
    if (psStr_(r['รหัสลูกค้า']) !== planId) return;
    var cur = psStr_(r['หมายเหตุระบบ']);
    if (cur.indexOf(note) < 0) deps.store.update(psTable_(ym), r._row, { 'หมายเหตุระบบ': cur ? cur + ' · ' + note : note });
  });
}
function psNewCode_(deps) {
  var abc = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789', s = 'P';
  for (var i = 0; i < 6; i++) s += abc.charAt(Math.floor((deps.random ? deps.random() : Math.random()) * abc.length));
  return s;
}
function psDateText_(d) { var b = new Date(new Date(d).getTime() + 7 * 3600000); return b.getUTCDate() + '/' + (b.getUTCMonth() + 1) + '/' + b.getUTCFullYear(); }
function psPlanActive_(deps, planId, now) {
  var C = svcThisMonth_(now), D = svcNextMonth_(now);
  return [C, D].some(function (ym) { return psPlans_(deps, ym).some(function (p) { return p.planId === planId; }); });
}

// ── ตรวจกับตารางจริง (Now 2026 สัปดาห์สุดท้าย + สัปดาห์ก่อน) และชีต Monthly ของเดือนนั้น ──
function psMiss_(deps, name, items, week) {
  var miss = [];
  items.forEach(function (it) {
    var d = week.filter(function (x) { return dayOfWeek_(x) === it.weekday; })[0];
    if (!d) return;
    it.hours.forEach(function (h) {
      var cell = deps.store.cell(d, it.court, h), lab = svcLabelOf_(cell);
      if (!psIsMine(lab, name)) miss.push({ date: d, court: it.court, hour: h, now: lab || 'ว่าง' });
    });
  });
  return miss;
}
function psCheck_(deps, name, items, ymC, grid) {
  var dates = deps.store.dates().filter(function (d) { return d.slice(0, 7) === ymC; }).sort();
  var w1 = dates.slice(-7), w2 = dates.slice(-14, -7), m1 = psMiss_(deps, name, items, w1), m2 = psMiss_(deps, name, items, w2), gm = [];
  if (grid) items.forEach(function (it) { it.hours.forEach(function (h) { if (!psIsMine(grid.get(it.weekday, it.court, h), name)) gm.push({ weekday: it.weekday, court: it.court, hour: h }); }); });
  var ok = !m1.length || (!m2.length && !gm.length);
  if (ok) return { ok: true };
  var notes = [];
  if (m1.length) notes.push('Now ' + thaiDate(w1[0]) + '–' + thaiDate(w1[w1.length - 1]) + ' ไม่ตรง: ' + m1.slice(0, 3).map(function (x) {
    return TH_DAY_SHORT[dayOfWeek_(x.date)] + ' ' + slotRanges([x]).join('') + ' (ตอนนี้: ' + psClean_(x.now) + ')'; }).join(', ') + (m1.length > 3 ? ' +' + (m1.length - 3) : ''));
  if (m2.length) notes.push('สัปดาห์ก่อนก็ไม่ตรง ' + m2.length + ' ช่อง');
  if (gm.length) notes.push('ชีต Monthly ไม่ตรง ' + gm.length + ' ช่อง');
  return { ok: false, note: notes.join(' · ') };
}

// ── วันที่ 15: สร้างบล็อกเดือนหน้า + ชีต Monthly_<เดือนหน้า> ──
function monthlyPrepare(deps) {
  var now = deps.now(), bk = new Date(now.getTime() + 7 * 3600000);
  if (bk.getUTCDate() < 15) return 0;
  var C = svcThisMonth_(now), D = svcNextMonth_(now);
  if (svcNotified_(deps, 'prepared', D)) return 0;
  var mark = function () { deps.store.append(SVC_NOTIFY, { kind: 'prepared', key: D, userId: '', at: now }); };
  if (psRows_(deps, D).length) { mark(); return 0; } // แอดมินทำเองแล้ว
  var src = psRows_(deps, C);
  if (!src.length) return 0;
  var gridC = deps.store.mgrid ? deps.store.mgrid(C) : null;
  if (deps.store.mgridCreate) deps.store.mgridCreate(D, C);
  var renewals = deps.store.rows(SVC_RENEW), out = [], dropped = [];
  src.forEach(function (r) {
    var st = psStr_(r['สถานะ']), name = psShortName(r);
    if (st === PS_CANCEL) { dropped.push(name); return; }
    var pp = psParsePlan(r), notes = pp.warn.slice(), code = psStr_(r['รหัสลูกค้า']) || psNewCode_(deps), check = pp.warn.length > 0;
    if (st !== PS_PAID) { notes.push('เดือน' + thaiMonth(C) + ' สถานะ: ' + (st || 'ว่าง')); check = true; }
    if (pp.items.length) { var ck = psCheck_(deps, name, pp.items, C, gridC); if (!ck.ok) { notes.push(ck.note); check = true; } }
    var credit = svcCollectCredit_(deps, code, D, renewals).amount, bill = pp.items.length ? monthlyBill({ name: name, items: pp.items }, D, credit) : null;
    if (credit) notes.push('หักฝากขาย ' + fmt_(credit) + ' บาท');
    if (!psStr_(r.userId)) notes.push('ยังไม่มี LINE · ส่งลิงก์รับบิล');
    out.push({ 'ลูกค้า': r['ลูกค้า'], 'วัน': r['วัน'], 'เวลา': r['เวลา'], 'คอร์ท': r['คอร์ท'], 'ยอดรวม (บาท)': bill ? bill.total : '',
      'สถานะ': PS_UNPAID, 'วันที่ชำระ': '', 'ชื่อบัญชีรับโอน': '', 'สถานะการส่งบิล': check ? PS_CHECK : PS_WAIT,
      'userId': psStr_(r.userId), 'รหัสลูกค้า': code, 'หมายเหตุระบบ': notes.join(' · ') });
  });
  out.forEach(function (o) { deps.store.append(psTable_(D), o); });
  // ชีต Monthly เดือนหน้า: ล้างบรรทัดจ่าย/ฝากขายของเดือนก่อน + ล้างชื่อคนที่ยกเลิก แล้วลงชื่อตามแผน
  var gridD = deps.store.mgrid ? deps.store.mgrid(D) : null;
  if (gridD) {
    gridD.cells().forEach(function (x) {
      if (psFree_(x.text)) return;
      var t = String(x.text).split('\n').filter(function (l) { return !/^\s*(จ่าย|ฝากขาย)/.test(l); }).join('\n').replace(/\n+$/, '');
      if (dropped.some(function (n) { return psIsMine(x.text, n); })) t = 'ว่าง';
      if (t !== x.text) gridD.set(x.weekday, x.court, x.hour, t);
    });
  }
  psSyncGrid_(deps, D);
  mark();
  var to = (deps.config.adminEmails || []).join(','), nc = out.filter(function (o) { return o['สถานะการส่งบิล'] === PS_CHECK; });
  if (to && deps.mail) {
    try {
      deps.mail.send(to, '[The Smash 44] เตรียมบิลรายเดือน ' + thaiMonth(D) + ' แล้ว ' + out.length + ' รายการ · ตรวจสอบ ' + nc.length,
        'ระบบสร้างรายการเดือน ' + thaiMonth(D) + ' ในชีต "' + PS_SHEET + '" และชีต "' + psGridName(D) + '" แล้ว\n' +
        'ยังไม่ส่งลูกค้า · กดอนุมัติในหน้าแอดมินได้เลย วันที่ 20 เวลา 10:00 ระบบส่งบิลรายการที่อนุมัติแล้ว\n\n' +
        (nc.length ? 'ต้องตรวจสอบ:\n' + nc.map(function (o) { return '• ' + o['ลูกค้า'] + ' — ' + o['หมายเหตุระบบ']; }).join('\n') + '\n\n' : '') +
        (dropped.length ? 'ไม่ยกไปเดือนหน้า (ยกเลิก): ' + dropped.join(', ') + '\n\n' : '') + (deps.config.sheetUrl || ''));
    } catch (e) {}
  }
  return out.length;
}

// ── ชีต Monthly ให้ตรงกับบล็อก: ลงชื่อ, ล้างช่องที่ย้ายออก, จ่ายแล้วเติม "จ่าย <วันที่>" ──
function psSyncGrid_(deps, ym) {
  var grid = deps.store.mgrid ? deps.store.mgrid(ym) : null;
  if (!grid) return 0;
  var rows = psRows_(deps, ym), want = {}, names = [], n = 0;
  rows.forEach(function (r) { var nm = psShortName(r); if (names.indexOf(nm) < 0) names.push(nm); });
  psPlans_(deps, ym).forEach(function (p) {
    var paid = p.status === PS_PAID, slots = monthlySlots({ name: p.name, items: p.items }, ym);
    p.items.forEach(function (it) {
      var days = slots.filter(function (s) { return dayOfWeek_(s.date) === it.weekday && s.court === it.court; })
        .map(function (s) { return Number(s.date.slice(8)); }).filter(function (d, i, a) { return a.indexOf(d) === i; });
      it.hours.forEach(function (h) { want[it.weekday + '|' + it.court + '|' + h] = { p: p, text: psLabel(p.name, paid ? days : null), paid: paid }; });
    });
  });
  // ช่องของลูกค้าในบล็อกที่ไม่อยู่ในแผนแล้ว → ว่าง
  grid.cells().forEach(function (x) {
    var k = x.weekday + '|' + x.court + '|' + x.hour, w = want[k];
    if (w && psIsMine(x.text, w.p.name)) return;
    if (names.some(function (nm) { return psIsMine(x.text, nm); }) && !(w && psFree_(x.text))) { grid.set(x.weekday, x.court, x.hour, 'ว่าง'); n++; }
  });
  Object.keys(want).forEach(function (k) {
    var w = want[k], q = k.split('|'), wd = Number(q[0]), cur = grid.get(wd, q[1], q[2]);
    if (psIsMine(cur, w.p.name)) {
      if (w.paid && !/\n\s*จ่าย/.test(String(cur))) { grid.set(wd, q[1], q[2], String(cur).replace(/\n+$/, '') + '\n' + w.text.split('\n').pop()); n++; }
      return;
    }
    if (psFree_(cur)) { grid.set(wd, q[1], q[2], w.text); n++; return; }
    psAddNote_(deps, ym, w.p.planId, 'ชีต Monthly ชนกับ ' + psClean_(cur) + ' (' + PS_DAY_TXT[wd] + ' ' + q[1] + ' ' + q[2] + ')');
  });
  return n;
}
// เติมรหัสลูกค้า/ยอดรวมที่ว่าง (แถวที่แอดมินเพิ่มเอง)
function psFillRows_(deps, ym) {
  var renewals = null;
  psRows_(deps, ym).forEach(function (r) {
    var patch = {};
    if (!psStr_(r['รหัสลูกค้า'])) patch['รหัสลูกค้า'] = psNewCode_(deps);
    if (psStr_(r['ยอดรวม (บาท)']) === '' && psStr_(r['สถานะ']) !== PS_CANCEL) {
      var pp = psParsePlan(r);
      if (pp.items.length) {
        renewals = renewals || deps.store.rows(SVC_RENEW);
        var code = patch['รหัสลูกค้า'] || psStr_(r['รหัสลูกค้า']);
        patch['ยอดรวม (บาท)'] = monthlyBill({ name: psShortName(r), items: pp.items }, ym, svcCollectCredit_(deps, code, ym, renewals).amount).total;
      }
    }
    if (!psStr_(r['สถานะการส่งบิล']) && psStr_(r['สถานะ']) !== PS_PAID && psStr_(r['สถานะ']) !== PS_CANCEL) patch['สถานะการส่งบิล'] = PS_WAIT;
    if (!psStr_(r['สถานะ'])) patch['สถานะ'] = PS_UNPAID;
    if (Object.keys(patch).length) deps.store.update(psTable_(ym), r._row, patch);
  });
}
// ทุก 5 นาที: เดือนนี้ + เดือนหน้า
function monthlySheetSync(deps) {
  var now = deps.now(), n = 0;
  [svcThisMonth_(now), svcNextMonth_(now)].forEach(function (ym) {
    if (!psRows_(deps, ym).length) return;
    if (ym === svcNextMonth_(now)) psFillRows_(deps, ym);
    n += psSyncGrid_(deps, ym);
  });
  return n;
}

// ── ลิงก์รับบิล (เดือนแรก: เก็บ LINE userId) ──
function claimBill(deps, user, req) {
  var ym = req.month, code = psStr_(req.code);
  var rows = psRows_(deps, ym).filter(function (r) { return psStr_(r['รหัสลูกค้า']) === code; });
  if (!rows.length) return svcFail_('ไม่พบบิลนี้ กรุณาติดต่อแอดมินค่ะ');
  var cur = rows.map(function (r) { return psStr_(r.userId); }).filter(Boolean)[0];
  if (cur && cur !== user.userId) return svcFail_('ลิงก์นี้ผูกกับ LINE อื่นแล้ว กรุณาติดต่อแอดมินค่ะ');
  if (!cur) {
    psSet_(deps, ym, code, { userId: user.userId });
    rows.forEach(function (r) {
      var note = psStr_(r['หมายเหตุระบบ']).split(' · ').filter(function (x) { return x && x.indexOf('ยังไม่มี LINE') < 0; }).join(' · ');
      deps.store.update(psTable_(ym), r._row, { 'หมายเหตุระบบ': note });
    });
  }
  var p = psPlans_(deps, ym).filter(function (x) { return x.planId === code; })[0];
  if (!p) return svcFail_('รายการนี้ยกเลิกแล้วค่ะ');
  var now = deps.now(), sent = false;
  if (psApproved_(deps, p) && now.getTime() >= renewalWindow(ym).sendAt.getTime()) sent = svcIssueBill_(deps, p, ym);
  var r = deps.store.rows(SVC_RENEW).filter(function (x) { return x.planId === code && x.month === ym; })[0];
  return svcOk_({ month: ym, name: p.name, lines: planLines({ name: p.name, items: p.items }), ready: !!r, sendAt: renewalWindow(ym).sendAt, sent: sent });
}

// The Smash 44 — ตัวต่อกับ Apps Script (ชีต, Slip2Go, LINE, API, trigger)

// ── ชีต ──
var V2_TABLE_KEYS = {
  // BookingLog เดิม A–H + I (สูตร Time out ห้ามเขียนทับ) + คอลัมน์ใหม่ J–M
  BookingLog: ['id', 'date', 'name', 'phone', 'slots', 'total', 'status', 'createdAt', '_timeout', 'userId', 'slipRef', 'paidAt', 'type']
};

// คอลัมน์ที่ปล่อยให้ Sheets แปลงเป็นวันที่ (สคริปต์เดิมอ่านแบบวันที่)
var V2_RAW_KEYS = { BookingLog: ['date'] };
// ข้อความที่ Sheets จะแปลงเอง (วันที่ ตัวเลข สูตร) → ใส่ ' นำหน้าให้เป็นข้อความ
function v2Text_(v) {
  return typeof v === 'string' && /^[0-9=+\-@'.]/.test(v) ? "'" + v : v;
}
// อ่านกลับ: ช่องที่ถูกแปลงเป็น Date ไปแล้ว → ข้อความเดิม
function v2FromCell_(k, v) {
  if (!(v instanceof Date)) return v;
  if (k === 'month') return Utilities.formatDate(v, 'Asia/Bangkok', 'yyyy-MM');
  if (k === 'hours' || k === 'hour') return Utilities.formatDate(v, 'Asia/Bangkok', 'M-d');
  return v;
}

// ── ชีต "ชำระเงินรายเดือน": บล็อกละเดือน วางเรียงข้างกัน (แถว 1 = ชื่อเดือน เช่น "Nov 2026" ที่คอลัมน์ที่ 5 ของบล็อก, แถว 2 = หัวคอลัมน์) ──
function V2PayBlocks(ss) {
  var cache = null;
  function load() {
    if (cache) return cache;
    var sh = ss.getSheetByName(PS_SHEET);
    if (!sh) return (cache = { sh: null, blocks: {}, values: [[], []], lc: 0 });
    var lc = Math.max(1, sh.getLastColumn()), lr = Math.max(2, sh.getLastRow());
    var values = sh.getRange(1, 1, lr, lc).getValues(), blocks = {}, starts = [];
    values[0].forEach(function (v, c) { var ym = psMonthFromLabel(v instanceof Date ? Utilities.formatDate(v, 'Asia/Bangkok', 'MMM yyyy') : v); if (ym) { blocks[ym] = { start: Math.max(0, c - 4) }; starts.push(Math.max(0, c - 4)); } });
    Object.keys(blocks).forEach(function (ym) {
      var b = blocks[ym], nx = starts.filter(function (x) { return x > b.start; }).sort(function (a, c) { return a - c; })[0];
      b.end = (nx === undefined ? lc : nx) - 1; b.keys = {};
      for (var c = b.start; c <= b.end; c++) { var k = String(values[1][c] || '').trim(); if (k && !(k in b.keys)) b.keys[k] = c; }

  }
  function cellOut(k, v) {

      var v = obj[k]; sh.getRange(row, b.keys[k] + 1).setValue(v === undefined || v === null ? '' : v2Text_(v));
      var vals = load().values; while (vals.length < row) vals.push([]); vals[row - 1][b.keys[k]] = v;

    append: function (ym, obj) {

}
// ── ชีต "Monthly_<เดือน>": ตารางรายสัปดาห์ (คอลัมน์ B = MON..SUN, C = สนาม, D… = ชั่วโมงละ 2 ช่อง) ──
var V2_WD = { SUN: 0, MON: 1, TUE: 2, WED: 3, THU: 4, FRI: 5, SAT: 6 };
function V2MonthlyGrids(ss) {
  var cache = {};
  function sheetOf(ym) {
    var sh = ss.getSheetByName(psGridName(ym));
    if (!sh && ym === svcThisMonth_(new Date())) sh = ss.getSheetByName('Monthly'); // ชีตเดิมที่ยังไม่ได้ใส่ชื่อเดือน
    return sh;
  }
  function grid(ym) {
    if (cache[ym] !== undefined) return cache[ym];
    var sh = sheetOf(ym);
    if (!sh) return (cache[ym] = null);
    var values = sh.getDataRange().getValues(), index = {}, wd = null, list = [];
    for (var r = 1; r < values.length; r++) {
      var d = String(values[r][1] || '').trim().toUpperCase();
      if (d in V2_WD) wd = V2_WD[d];
      var c = String(values[r][2] || '').trim().toUpperCase();
      if (wd !== null && c) { index[wd + '|' + c] = r; list.push([wd, c, r]); }
    }
    function col(h) { var i = SVC_HOURS.indexOf(h); if (i < 0) throw new Error('unknown hour ' + h); return 3 + i * 2; }
    return (cache[ym] = {
      cells: function () {
        var out = [];
        list.forEach(function (x) { SVC_HOURS.forEach(function (h) { var v = values[x[2]][col(h)]; out.push({ weekday: x[0], court: x[1], hour: h, text: v == null ? '' : String(v) }); }); });
        return out;
      },
      get: function (w, c, h) { var r = index[w + '|' + c]; return r === undefined ? '' : String(values[r][col(h)] == null ? '' : values[r][col(h)]); },
      set: function (w, c, h, text) { var r = index[w + '|' + c]; if (r === undefined) return; sh.getRange(r + 1, col(h) + 1).setValue(v2Text_(text)); values[r][col(h)] = text; }
    });
  }
  return {
    grid: grid,
    // วันที่ 15: ใส่ชื่อเดือนให้ชีตเดิม (Monthly → Monthly_Nov 2026) แล้วก๊อปเป็น Monthly_<เดือนหน้า>
    create: function (ymNew, ymFrom) {
      if (ss.getSheetByName(psGridName(ymNew))) return;
      var src = ss.getSheetByName(psGridName(ymFrom));
      if (!src) { src = ss.getSheetByName('Monthly'); if (src) src.setName(psGridName(ymFrom)); }
      if (!src) return;
      var copy = src.copyTo(ss).setName(psGridName(ymNew));
      ss.setActiveSheet(copy); ss.moveActiveSheet(src.getIndex() + 1);
      delete cache[ymNew]; delete cache[ymFrom];
    }
  };
}

// nowSheets = ชื่อชีตตารางสนาม หรือหลายชีต (เดือนนี้ + เดือนหน้า)
function V2SheetStore(ss, nowSheets) {
  var names = [].concat(nowSheets);
  var grid = null, tables = {};

  // ── ตารางสนาม Now 2026 ──
  function loadGrid() {
    if (grid) return grid;
    var index = {}, dates = [], parts = [];
    names.forEach(function (nm) {
      var sh = ss.getSheetByName(nm);
      if (!sh) return;
      var values = sh.getDataRange().getValues(), cur = null, part = { sh: sh, values: values };
      parts.push(part);
      for (var r = 1; r < values.length; r++) {
        var a = values[r][0];
        if (a !== '' && a !== null) {
          var iso = sheetDateToISO(a);
          if (/^\d{4}-\d{2}-\d{2}$/.test(iso)) { cur = iso; if (dates.indexOf(iso) < 0) dates.push(iso); }
        }
        var court = String(values[r][2] || '').trim().toUpperCase();
        if (cur && court) index[cur + '|' + court] = { p: part, r: r };
      }
    });
    grid = { index: index, dates: dates };
    return grid;
  }
  function col(hour) {
    var i = SVC_HOURS.indexOf(hour);
    if (i < 0) throw new Error('unknown hour ' + hour);
    return 3 + i * 2; // 0-based
  }
  function at(d, c) {
    var x = loadGrid().index[d + '|' + c];
    if (!x) throw new Error('no grid row ' + d + ' ' + c);
    return x;
  }

  // ── ตารางแบบแถว ──
  function sheet(t) { return ss.getSheetByName(t); }
  function keysOf(t) {
    if (V2_TABLE_KEYS[t]) return V2_TABLE_KEYS[t];
    var sh = sheet(t);
    if (!sh || sh.getLastRow() < 1) return [];
    if (tables[t]) return tables[t].keys;
    var ks = sh.getRange(1, 1, 1, sh.getLastColumn()).getValues()[0].map(String).map(function (x, i) { return x === '' ? '_blank' + i : x; });
    while (ks.length && /^_blank/.test(ks[ks.length - 1])) ks.pop(); // หัวว่างท้ายแถวไม่นับ
    return ks;
  }
  function loadTable(t) {
    if (tables[t]) return tables[t];
    var sh = sheet(t), keys = keysOf(t), rows = [];
    if (sh && sh.getLastRow() >= 2 && keys.length) {
      var vals = sh.getRange(2, 1, sh.getLastRow() - 1, keys.length).getValues();
      vals.forEach(function (v, i) {
        if (v[0] === '' || v[0] === null) return;
        var o = { _row: i + 2 };
        keys.forEach(function (k, j) { if (k.charAt(0) !== '_') o[k] = v2FromCell_(k, v[j]); });
        if (t === 'BookingLog' && o.date instanceof Date) o.date = sheetDateToISO(o.date);
        rows.push(o);
      });
    }
    tables[t] = { keys: keys, rows: rows };
    return tables[t];
  }
  function ensureHeader(t, obj) {
    var sh = sheet(t) || ss.insertSheet(t), keys = keysOf(t);
    if (V2_TABLE_KEYS[t]) return { sh: sh, keys: keys };
    var add = Object.keys(obj).filter(function (k) { return k.charAt(0) !== '_' && keys.indexOf(k) < 0; });
    if (add.length) {

      sh.getRange(1, 1, 1, keys.length).setValues([keys]);

  }
  // เขียนเป็นช่วงต่อเนื่อง ข้ามคอลัมน์ที่ขึ้นต้นด้วย _ (เช่นสูตร)

    var raw = V2_RAW_KEYS[t] || [], i = 0;
    while (i < keys.length) {
      if (keys[i].charAt(0) === '_' || (onlyGiven && !(keys[i] in obj))) { i++; continue; }
      var j = i, vals = [];
      while (j < keys.length && keys[j].charAt(0) !== '_' && (!onlyGiven || keys[j] in obj)) { var v = obj[keys[j]]; vals.push(v === undefined || v === null ? '' : (raw.indexOf(keys[j]) > -1 ? v : v2Text_(v))); j++; }
      sh.getRange(row, i + 1, 1, vals.length).setValues([vals]);
      i = j;
    }
  }

  var pay = V2PayBlocks(ss), grids = V2MonthlyGrids(ss);
  function payYm(t) { return String(t).indexOf(PS_SHEET + '|') === 0 ? String(t).slice(PS_SHEET.length + 1) : null; }
  return {
    mgrid: function (ym) { return grids.grid(ym); },
    mgridCreate: function (ymNew, ymFrom) { grids.create(ymNew, ymFrom); },
    dates: function () { return loadGrid().dates.slice(); },
    hasDate: function (d) { return loadGrid().dates.indexOf(d) > -1; },
    hasRow: function (d, c) { return !!loadGrid().index[d + '|' + c]; },
    cell: function (d, c, h) {
      var x = loadGrid().index[d + '|' + c];
      if (!x) return ['ว่าง', ''];
      var k = col(h), v = x.p.values[x.r];
      return [String(v[k] == null ? '' : v[k]), String(v[k + 1] == null ? '' : v[k + 1])];
    },
    setSlot: function (d, c, h, label) {
      var x = at(d, c), k = col(h), pair = label === 'ว่าง' ? ['ว่าง', ''] : [label, label];
      x.p.sh.getRange(x.r + 1, k + 1, 1, 2).setValues([pair.map(v2Text_)]);
      x.p.values[x.r][k] = pair[0]; x.p.values[x.r][k + 1] = pair[1];
    },
    rows: function (t) { if (payYm(t)) return pay.rows(payYm(t)); return loadTable(t).rows.map(function (o) { return Object.assign({}, o); }); },
    append: function (t, obj) {

    update: function (t, row, patch) {

    }
  };
}

function v2Route(deps, body, user) {
  if (!user) return { ok: false, reason: 'กรุณาเปิดหน้านี้จาก LINE ของ The Smash 44 ค่ะ' };
  var a = body && body.action;
  try {
    // จำภาษาของลูกค้าไว้ใช้ตอนส่งการ์ด (เขียนเฉพาะตอนเปลี่ยน)
    if (body.lang && svcLang_(deps, user.userId) !== (body.lang === 'en' ? 'en' : 'th'))
      deps.withLock(function () { svcSetLang_(deps, user, body.lang); return { ok: true }; });
    if (V2_READS[a]) return V2_READS[a](deps, user, body);

    return { ok: false, reason: 'ไม่รู้จักคำสั่งนี้ค่ะ' };
  } catch (e) {
    Logger.log('v2Route ' + a + ': ' + (e && e.stack || e));
    return { ok: false, reason: 'ระบบขัดข้อง กรุณาลองใหม่หรือติดต่อแอดมินค่ะ' };
  }
}

function v2ValidateCards() {

  function readSlip(file) {
    return new Promise(function (ok, bad) {
      var rd = new FileReader();
      rd.onerror = bad;
      rd.onload = function () {
        var img = new Image();
        img.onerror = function () { ok(rd.result); };
        img.onload = function () {
          var max = 1400, sc = Math.min(1, max / Math.max(img.width, img.height));
          if (sc === 1 && rd.result.length < 1500000) { ok(rd.result); return; }
          var cv = document.createElement('canvas'); cv.width = Math.round(img.width * sc); cv.height = Math.round(img.height * sc);
          var cx = cv.getContext('2d'); cx.fillStyle = '#fff'; cx.fillRect(0, 0, cv.width, cv.height); cx.drawImage(img, 0, 0, cv.width, cv.height);
          ok(cv.toDataURL('image/jpeg', 0.9));
        };
        img.src = rd.result;
      };
      rd.readAsDataURL(file);
    });
  }

      S.date = r.data.dates[0] || null;
      if (r.data.pending) { var p = r.data.pending; S.pay = { kind: 'one', id: p.id, total: p.total, payBy: p.payBy, title: thaiDate(p.date), lines: [slotRanges(p.slots).join(' , ')] }; }
      if (page === 'claim') return api('claimBill', { month: m, code: q.get('c') || '' }, 'กำลังรับบิล').then(function (x) {
        if (!x.ok) { say(false, x.reason); return go('home'); }
        say(true, x.data.ready ? 'ได้รับบิลรายเดือน ' + thaiMonth(x.data.month) + ' · ชำระได้เลยค่ะ' : 'บันทึก LINE แล้วค่ะ ระบบจะส่งบิลรายเดือน ' + thaiMonth(x.data.month) + ' ทาง LINE วันที่ 20 ค่ะ');
        return go(x.data.ready ? 'monthly' : 'home');
      });
      if (page === 'book') return go('book');
      if (page === 'monthly') return go('monthly');
      if (/^renew|^pay-extra/.test(page)) {
        S.tab = 'monthly';
        return loadMonthly().then(function () {
          var r0 = (S.monthly || []).filter(function (x) { return x.month === m && x.status !== 'ยกเลิก' && x.status !== 'หมดเวลา'; })[0];
          if (r0 && page === 'renew-cancel') S.ask = 'cancel:' + r0.id;
          if (r0 && page === 'pay-extra' && r0.change && r0.change.settleType === 'extra' && !r0.change.extraPaid) {
            S.pay = { kind: 'extra', id: r0.id, renewalId: r0.id, month: r0.month, total: r0.change.settleAmount, payBy: r0.change.settlePayBy, title: 'ส่วนต่างย้ายสนาม ' + thaiMonth(r0.month), lines: r0.lines };
            S.tab = 'pay';
          }
          render();
        });
      }
      go('home');
    });
  }
  function boot() {
    if (window.SMASH_MOCK) return start();
    if (!window.liff || CFG.LIFF_ID.indexOf('__') === 0) { LANG = detectLang(); $('screen').innerHTML = '<div class="fatal">' + tr('ยังไม่ได้ตั้งค่า LIFF กรุณาติดต่อแอดมินค่ะ') + '</div>'; return; }
    liff.init({ liffId: CFG.LIFF_ID }).then(function () {
      if (!liff.isLoggedIn()) { liff.login({ redirectUri: location.href }); return; }
      idToken = liff.getIDToken();
      return start();
    }).catch(function () { LANG = detectLang(); $('screen').innerHTML = '<div class="fatal">' + tr('เปิดหน้านี้จากเมนูใน LINE ของ The Smash 44 ค่ะ') + '</div>'; });
  }
  window.SMASH_APP = { reload: function () { S.init = null; S.my = S.monthly = S.admin = S.avail = null; S.pay = null; return start(); } };
  boot();
})();
</script>
